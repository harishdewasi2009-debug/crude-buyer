services:
  - type: web
    name: crude-buyer-agent
    runtime: python
    plan: starter            # needs a paid plan: persistent disk + always-on (free plan sleeps and loses data)
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app --workers 1 --threads 8 --timeout 120
    healthCheckPath: /login
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: CBA_DATA_DIR
        value: /var/data
      - key: CBA_BEHIND_PROXY
        value: "1"
      - key: DASHBOARD_TOKEN
        generateValue: true
      - key: CBA_USER_AGENT
        value: CrudeBuyerResearchBot/1.0 (your company; contact you@example.com)
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: BRAVE_API_KEY
        sync: false
