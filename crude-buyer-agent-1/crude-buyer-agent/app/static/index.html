<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Crude Buyer Intelligence</title>
<style>
:root{--bg:#f4f6f9;--card:#fff;--ink:#17202e;--mut:#667085;--line:#e3e8ef;--brand:#1f3a5f;--acc:#0f766e;--a:#0f766e;--b:#b45309;--c:#6b7280;--d:#9f1239;--bad:#b42318;--ok:#067647}
*{box-sizing:border-box}body{margin:0;font:14px/1.45 system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);display:flex;min-height:100vh}
nav{width:215px;background:var(--brand);color:#cfd9e8;padding:16px 0;position:sticky;top:0;height:100vh;flex-shrink:0}
nav h1{font-size:15px;color:#fff;margin:0 16px 14px;line-height:1.25}
nav a{display:block;padding:9px 16px;color:inherit;text-decoration:none;cursor:pointer;border-left:3px solid transparent}
nav a:hover{background:#2a4a75}nav a.on{background:#2a4a75;color:#fff;border-color:#5eead4}
main{flex:1;padding:22px 26px;min-width:0}h2{margin:0 0 14px;font-size:20px}h3{margin:18px 0 8px;font-size:15px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-bottom:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:13px 14px}
.card .n{font-size:26px;font-weight:650}.card .l{color:var(--mut);font-size:12px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:16px;overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}th,td{text-align:left;padding:7px 9px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--mut);font-weight:600;font-size:12px;white-space:nowrap}tr.click{cursor:pointer}tr.click:hover{background:#f8fafc}
button,.btn{background:var(--brand);color:#fff;border:0;border-radius:7px;padding:8px 13px;font:inherit;cursor:pointer;text-decoration:none;display:inline-block}
button.sec{background:#fff;color:var(--brand);border:1px solid var(--line)}button.warn{background:var(--bad)}button:disabled{opacity:.45;cursor:not-allowed}
input,select,textarea{font:inherit;padding:7px 9px;border:1px solid #cdd5df;border-radius:7px;background:#fff;max-width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11.5px;font-weight:600;color:#fff;white-space:nowrap}
.cA{background:var(--a)}.cB{background:var(--b)}.cC{background:var(--c)}.cD{background:var(--d)}.cUNCLASSIFIED{background:#98a2b3}
.s-completed,.s-no_findings{color:var(--ok)}.s-failed,.s-interrupted{color:var(--bad)}.s-running{color:#175cd3}.s-skipped,.s-stopped{color:var(--b)}
.mut{color:var(--mut)}.nf{color:#98a2b3;font-style:italic}.log{font:12px/1.5 ui-monospace,Consolas,monospace;background:#0b1220;color:#cbd5e1;border-radius:8px;padding:10px;height:230px;overflow:auto;white-space:pre-wrap}
.log .warn{color:#fbbf24}.log .error{color:#f87171}.note{background:#fffbeb;border:1px solid #fde68a;color:#78350f;border-radius:8px;padding:9px 12px;margin-bottom:12px;font-size:13px}
.drawer{position:fixed;right:0;top:0;bottom:0;width:min(640px,100%);background:#fff;box-shadow:-8px 0 30px #0003;padding:20px;overflow:auto;transform:translateX(105%);transition:.2s;z-index:5}.drawer.on{transform:none}
.quote{border-left:3px solid var(--line);padding:2px 10px;margin:4px 0;color:#344054;font-style:italic}.view{display:none}.view.on{display:block}
a.l{color:#175cd3;word-break:break-all}.kv{display:grid;grid-template-columns:160px 1fr;gap:3px 10px}.kv div:nth-child(odd){color:var(--mut)}
@media(max-width:760px){body{flex-direction:column}nav{width:100%;height:auto;position:static;display:flex;flex-wrap:wrap}nav h1{width:100%}main{padding:14px}}
</style></head><body>
<nav><h1>Crude Oil Buyer<br>Intelligence Agent</h1><div id="menu"></div></nav>
<main>
<section class="view" id="v-dashboard"></section><section class="view" id="v-find"></section><section class="view" id="v-refinery"></section>
<section class="view" id="v-tenders"></section><section class="view" id="v-companies"></section><section class="view" id="v-contacts"></section>
<section class="view" id="v-dd"></section><section class="view" id="v-history"></section><section class="view" id="v-exports"></section><section class="view" id="v-ai"></section>
</main>
<aside class="drawer" id="drawer"></aside>
<script>
const VIEWS=[["dashboard","Dashboard"],["find","Find Buyers"],["refinery","Refinery Research"],["tenders","Tender Awards"],["companies","Private Companies"],["contacts","Buyer Contacts"],["dd","Due Diligence"],["history","Research History"],["exports","Export Reports"],["ai","AI Settings"]];
const $=s=>document.querySelector(s);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nf=v=>v?esc(v):'<span class="nf">NOT FOUND</span>';
const link=u=>u&&/^https?:\/\//.test(u)?`<a class="l" href="${esc(u)}" target="_blank" rel="noopener noreferrer">${esc(u)}</a>`:nf(u);
const LBL={A:"A · Confirmed",B:"B · Potential",C:"C · Vendor",D:"D · Not a buyer",UNCLASSIFIED:"Unclassified"};
const pill=c=>`<span class="pill c${esc(c)}">${esc(LBL[c]||c)}</span>`;
async function api(p,m="GET",b){const r=await fetch("/api/"+p,{method:m,headers:{"Content-Type":"application/json","X-Requested-With":"cba"},body:b?JSON.stringify(b):undefined});
  const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||r.statusText);return j}
const table=(cols,rows,click)=>`<table><tr>${cols.map(c=>`<th>${esc(c[0])}</th>`).join("")}</tr>${rows.map(r=>`<tr ${click?`class="click" onclick="${click(r)}"`:""}>${cols.map(c=>`<td>${c[1](r)}</td>`).join("")}</tr>`).join("")||`<tr><td colspan="${cols.length}" class="mut">Nothing here yet.</td></tr>`}</table>`;
let cur="dashboard",logSince=0,timer=null;
$("#menu").innerHTML=VIEWS.map(v=>`<a data-v="${v[0]}">${v[1]}</a>`).join("");
document.querySelectorAll("nav a").forEach(a=>a.onclick=()=>go(a.dataset.v));
function go(v){cur=v;document.querySelectorAll("nav a").forEach(a=>a.classList.toggle("on",a.dataset.v===v));document.querySelectorAll(".view").forEach(s=>s.classList.toggle("on",s.id==="v-"+v));$("#drawer").classList.remove("on");R[v]()}

/* ---------- Dashboard ---------- */
async function runBar(){const s=await api("status?since=0");const run=s.run;const st=run?run.status:"idle";
  const ctrl=`<div class="row"><button onclick="act('start')" ${s.active?"disabled":""}>Start research</button><button class="sec" onclick="act('pause')" ${s.active&&!s.paused?"":"disabled"}>Pause</button><button class="sec" onclick="act('resume')" ${s.paused?"":"disabled"}>Resume</button><button class="warn" onclick="act('stop')" ${s.active?"":"disabled"}>Stop</button><span class="mut">Run status: <b>${esc(st)}</b>${run?" · run #"+run.id:""}</span></div>`;
  return {s,ctrl}}
async function act(a,cfg){try{await api("run/"+a,"POST",a==="start"?(cfg||{discovery:true}):undefined)}catch(e){alert(e.message)}tick()}
async function liveBlocks(s){const t=s.tasks;return `<h3>Live tasks</h3><div class="panel">${table([["#",r=>r.id],["Agent",r=>esc(r.agent)],["Task",r=>esc(r.type)],["Target",r=>esc(r.target)],["Status",r=>`<b class="s-${esc(r.status)}">${esc(r.status)}</b>`],["Error",r=>esc(r.error||"")]],t)}</div><h3>Research log</h3><div class="log" id="log">${s.logs.slice().reverse().map(l=>`<div class="${esc(l.level)}">${esc(l.ts.slice(11,19))} [${esc(l.agent)}] ${esc(l.message)}</div>`).join("")}</div>`}
R={};
R.dashboard=async()=>{const [sm,{s,ctrl}]=await Promise.all([api("summary"),runBar()]);
  const cards=[["Companies discovered",sm.total],["Confirmed buyers (A)",sm.confirmed],["Potential buyers (B)",sm.potential],["Refinery-linked vendors (C)",sm.vendors],["Verified procurement contacts",sm.verified_contacts],["Pending verification",sm.pending],["Research tasks completed",sm.tasks_done],["Failed tasks",sm.tasks_failed]];
  $("#v-dashboard").innerHTML=`<h2>Dashboard</h2><div class="cards">${cards.map(c=>`<div class="card"><div class="n">${c[1]}</div><div class="l">${c[0]}</div></div>`).join("")}</div><div class="panel">${ctrl}</div>${await liveBlocks(s)}`};

/* ---------- Find Buyers ---------- */
R.find=async()=>{const [l,{ctrl}, rows]=await Promise.all([api("llm/status"),runBar(),api("companies?primary=1")]);
  const any=l.providers.some(p=>p.configured);
  $("#v-find").innerHTML=`<h2>Find Buyers</h2>${any?"":'<div class="note">No AI provider key is set on the server. The agent runs in <b>rule-based mode</b>: it reads tender tables and pages, but cannot use AI extraction, cross-model checks or web discovery, and class A is limited to rule-checked official records.</div>'}${l.search_configured?"":'<div class="note">No web-search key (BRAVE_API_KEY or GOOGLE_CSE_KEY + GOOGLE_CSE_CX) is set, so private-buyer discovery beyond the refinery sites is skipped.</div>'}
  <div class="panel"><h3 style="margin-top:0">Research</h3><div class="row"><button onclick="act('start',{discovery:true})">Research all enabled sources + discovery</button><button class="sec" onclick="act('start',{discovery:false})">Refinery sources only</button><button class="sec" onclick="act('pause')">Pause</button><button class="sec" onclick="act('resume')">Resume</button><button class="warn" onclick="act('stop')">Stop</button></div>
  <div class="row"><input id="cn" placeholder="Company legal name"><input id="cw" placeholder="Official website https://…" size="32"><button class="sec" onclick="oneCo()">Research this company</button></div><div id="runbar">${ctrl}</div></div>
  <h3>Primary sales prospects (A + B)</h3><div class="panel">${companyTable(rows)}</div>`};
async function oneCo(){const n=$("#cn").value.trim();if(!n)return alert("Enter a company name");await act("start",{companies:[{name:n,website:$("#cw").value.trim()}]})}

/* ---------- Companies ---------- */
const companyTable=rows=>table([["Company",r=>`<b>${esc(r.name)}</b><div class="mut">${esc(r.category||"")}</div>`],["Class",r=>pill(r.classification)],["Confidence",r=>esc(r.confidence||"-")],["Ownership",r=>esc(r.ownership||"-")],["State",r=>nf(r.state)],["Refinery connection",r=>nf(r.refinery_connection)],["Verification",r=>esc(r.verification_status)],["Follow-up",r=>esc(r.follow_up_status)]],rows,r=>`openCo(${r.id})`);
R.companies=async()=>{const f=window._f||{};const q=new URLSearchParams(Object.entries(f).filter(e=>e[1]));const rows=await api("companies?"+q);
  const sel=(k,opts)=>`<select onchange="setF('${k}',this.value)"><option value="">${k}: all</option>${opts.map(o=>`<option ${f[k]===o[0]?"selected":""} value="${esc(o[0])}">${esc(o[1])}</option>`).join("")}</select>`;
  $("#v-companies").innerHTML=`<h2>Private Companies</h2><div class="row"><input placeholder="Search name/notes" value="${esc(f.q||"")}" onchange="setF('q',this.value)">${sel("classification",[["A","A"],["B","B"],["C","C"],["D","D"],["UNCLASSIFIED","Unclassified"]])}${sel("verification",["PENDING","EVIDENCE_COLLECTED","QC_PASSED","QC_DOWNGRADED","MANUAL_REVIEW","UNVERIFIED"].map(x=>[x,x]))}${sel("ownership",["Private","PSU","JV (PSU + private)"].map(x=>[x,x]))}<input placeholder="Refinery connection" value="${esc(f.refinery||"")}" onchange="setF('refinery',this.value)"><input placeholder="State" value="${esc(f.state||"")}" onchange="setF('state',this.value)"></div><div class="panel">${companyTable(rows)}</div>`};
function setF(k,v){window._f=Object.assign(window._f||{},{[k]:v});R.companies()}
async function openCo(id){const d=await api("companies/"+id);const c=d.company;
  const urls=(()=>{try{return JSON.parse(c.evidence_urls||"[]")}catch{return[]}})();
  $("#drawer").innerHTML=`<div class="row"><h2 style="margin:0">${esc(c.name)}</h2><button class="sec" onclick="$('#drawer').classList.remove('on')">Close</button></div><p>${pill(c.classification)} <span class="mut">confidence: ${esc(c.confidence||"-")} · ${esc(c.verification_status)} · ${esc(c.buyer_type||"")}</span></p>
  <div class="kv"><div>Category</div><div>${nf(c.category)}</div><div>Ownership</div><div>${nf(c.ownership)}</div><div>CIN</div><div>${nf(c.cin)}</div><div>Country / State / City</div><div>${nf(c.country)} / ${nf(c.state)} / ${nf(c.city)}</div><div>Registered address</div><div>${nf(c.registered_address)}</div><div>Website</div><div>${link(c.website)}</div><div>Refinery connection</div><div>${nf(c.refinery_connection)}</div><div>Procurement contact</div><div>${nf(c.procurement_contact)}</div><div>Procurement email</div><div>${nf(c.procurement_email)}</div><div>Official email</div><div>${nf(c.official_email)}</div><div>Phone</div><div>${nf(c.phone)}</div><div>LinkedIn</div><div>${link(c.linkedin)}</div><div>Supplier registration</div><div>${link(c.supplier_reg_link)}</div><div>Contact source</div><div>${link(c.contact_source_url)}</div><div>Last researched</div><div>${nf(c.last_research_date)}</div></div>
  <h3>Evidence</h3>${d.evidence.map(e=>`<div><b>${esc(e.kind)}</b> · ${e.verified?'<span class="s-completed">verified in page text</span>':'<span class="s-failed">NOT verified</span>'} · ${esc(e.method)} · ${esc(e.evidence_date||"date n/a")}<div class="quote">${esc(e.quote)}</div>${link(e.url)}</div><hr style="border:0;border-top:1px solid var(--line)">`).join("")||'<span class="nf">No evidence collected</span>'}
  <h3>Tender records</h3>${d.tenders.map(t=>`<div>${esc(t.source_name)} · ${esc(t.tender_no||"no ref")} · ${esc(t.award_date||"")} · ${esc(t.product_category)} · <i>${esc(t.direction)}</i><div class="mut">${esc(t.description)}</div>${link(t.source_url)}</div>`).join("")||'<span class="nf">none</span>'}
  <h3>Due-diligence flags</h3>${d.flags.map(f=>`<div><b class="${f.severity==="high"?"s-failed":f.severity==="medium"?"s-skipped":"mut"}">${esc(f.severity.toUpperCase())}</b> ${esc(f.code)} — ${esc(f.text)}</div>`).join("")||'<span class="mut">None raised (not a clearance).</span>'}
  <h3>Notes &amp; follow-up</h3><div class="row"><select id="fu">${["Not contacted","Researching","Intro call booked","In discussion","Not interested","Disqualified"].map(o=>`<option ${c.follow_up_status===o?"selected":""}>${o}</option>`).join("")}</select></div><textarea id="nt" rows="4" style="width:100%">${esc(c.notes||"")}</textarea><div class="row" style="margin-top:8px"><button onclick="saveCo(${c.id})">Save</button><span class="mut">Classification is set only by evidence and QC; it cannot be edited by hand.</span></div>
  <p class="mut">Nothing is ever sent to this company automatically.</p>`;
  $("#drawer").classList.add("on")}
async function saveCo(id){await api("companies/"+id,"PATCH",{follow_up_status:$("#fu").value,notes:$("#nt").value});openCo(id)}

/* ---------- Refinery research ---------- */
R.refinery=async()=>{const s=await api("sources");
  $("#v-refinery").innerHTML=`<h2>Refinery Research</h2><div class="panel">${table([["On",r=>`<input type="checkbox" ${r.enabled?"checked":""} onchange="togg(${r.id},this.checked)">`],["Source",r=>`<b>${esc(r.name)}</b>`],["Website",r=>link(r.url)],["Role",r=>`<select onchange="patchS(${r.id},{role:this.value})"><option ${r.role==="refiner"?"selected":""}>refiner</option><option ${r.role==="producer"?"selected":""}>producer</option></select>`],["Ownership",r=>esc(r.ownership||"")],["Extra tender-portal URLs",r=>`<input size="26" placeholder="https://… (comma separated)" value="${esc((JSON.parse(r.extra_urls||"[]")).join(", "))}" onchange="patchS(${r.id},{extra_urls:this.value.split(',').map(x=>x.trim()).filter(Boolean)})">`],["",r=>`<button class="sec" onclick="act('start',{sources:[${r.id}]});go('dashboard')">Research now</button>`]],s)}</div>
  <div class="note"><b>Role matters:</b> for a <i>refiner</i>, a crude <i>purchase</i> tender's winner is a <u>supplier</u> (not a buyer). For a <i>producer</i> (e.g. ONGC, Oil India), a crude <i>sale</i> award's winner is a <u>buyer</u>. Ambiguous awards are never promoted above class B.</div>
  <h3>Add a source</h3><div class="row"><input id="sn" placeholder="Name"><input id="su" placeholder="https://…" size="30"><select id="sr"><option>refiner</option><option>producer</option></select><input id="so" placeholder="Ownership (Private/PSU)"><button class="sec" onclick="addS()">Add</button></div>`};
const togg=(id,v)=>api("sources/"+id,"PATCH",{enabled:v?1:0});const patchS=(id,b)=>api("sources/"+id,"PATCH",b);
async function addS(){try{await api("sources","POST",{name:$("#sn").value,url:$("#su").value,role:$("#sr").value,ownership:$("#so").value})}catch(e){alert(e.message)}R.refinery()}

/* ---------- Tenders / Contacts / DD / History ---------- */
R.tenders=async()=>{const t=await api("tenders");$("#v-tenders").innerHTML=`<h2>Tender Awards</h2><div class="panel">${table([["Issuer",r=>esc(r.source_name)],["Tender no",r=>nf(r.tender_no)],["Successful bidder",r=>`<b>${esc(r.bidder)}</b>`],["Award date",r=>nf(r.award_date)],["Description",r=>esc(r.description)],["Category",r=>esc(r.product_category)],["Value",r=>nf(r.contract_value)],["Duration",r=>nf(r.duration)],["Reads as",r=>esc(r.kind)],["Verified",r=>r.verified?"yes":"no"],["Source",r=>link(r.source_url)]],t)}</div>`};
R.contacts=async()=>{const t=await api("contacts");$("#v-contacts").innerHTML=`<h2>Buyer Contacts</h2><div class="note">Only details found on the company's own pages are shown. Emails on other domains and free-mail addresses are never recorded as official, and nothing is guessed.</div><div class="panel">${table([["Company",r=>`<b>${esc(r.name)}</b>`],["Class",r=>pill(r.classification)],["Procurement contact",r=>nf(r.procurement_contact)],["Procurement email",r=>nf(r.procurement_email)],["Official email",r=>nf(r.official_email)],["Phone",r=>nf(r.phone)],["LinkedIn",r=>link(r.linkedin)],["Supplier registration",r=>link(r.supplier_reg_link)],["Source page",r=>link(r.contact_source_url)]],t,r=>`openCo(${r.id})`)}</div>`};
R.dd=async()=>{const t=await api("flags");$("#v-dd").innerHTML=`<h2>Due Diligence</h2><div class="note">Automated flags are a screening aid, not a clearance. Run your own sanctions / KYC screening and verify the CIN on the MCA portal (login/CAPTCHA protected, so not automated).</div><div class="panel">${table([["Severity",r=>`<b class="${r.severity==="high"?"s-failed":r.severity==="medium"?"s-skipped":"mut"}">${esc(r.severity)}</b>`],["Company",r=>esc(r.name)],["Class",r=>pill(r.classification)],["Flag",r=>esc(r.code)],["Detail",r=>esc(r.text)],["Source",r=>link(r.source_url)]],t,r=>`openCo(${r.company_id})`)}</div>`};
R.history=async()=>{const h=await api("history");$("#v-history").innerHTML=`<h2>Research History</h2><h3>Runs</h3><div class="panel">${table([["#",r=>r.id],["Status",r=>`<b class="s-${esc(r.status)}">${esc(r.status)}</b>`],["Started",r=>esc(r.started)],["Finished",r=>esc(r.finished||"")],["Config",r=>esc(r.config)]],h.runs)}</div><h3>Pages visited</h3><div class="panel">${table([["Time",r=>esc(r.ts)],["URL",r=>esc(r.url)],["HTTP",r=>r.status||"-"],["Result",r=>esc(r.note)],["Purpose",r=>esc(r.purpose)]],h.pages)}</div><h3>Tasks</h3><div class="panel">${table([["Run",r=>r.run_id],["Agent",r=>esc(r.agent)],["Task",r=>esc(r.type)],["Target",r=>esc(r.target)],["Status",r=>`<b class="s-${esc(r.status)}">${esc(r.status)}</b>`],["Result / error",r=>esc(r.error||r.result||"")]],h.tasks)}</div>`};
R.exports=async()=>{const l=await api("exports");$("#v-exports").innerHTML=`<h2>Export Reports</h2><div class="panel"><p class="mut">Files are generated fresh from the database on download. Every claim carries its source URL; unknown values read NOT FOUND.</p>${l.map(n=>`<div class="row"><a class="btn" href="/api/export/${encodeURIComponent(n)}">${esc(n)}</a></div>`).join("")}</div>`};

/* ---------- AI settings ---------- */
R.ai=async()=>{const [l,u,st]=await Promise.all([api("llm/status"),api("llm/usage"),api("settings")]);
  const prov=l.providers.map(p=>p.provider);
  $("#v-ai").innerHTML=`<h2>AI Settings</h2><div class="note">API keys are read from <b>server environment variables only</b> (shown below). They are never stored in the database or sent to this page.</div>
  <div class="panel">${table([["Provider",r=>`<b>${esc(r.provider)}</b>`],["Server env var",r=>`<code>${esc(r.env_var)}</code>`],["Key",r=>r.configured?'<b class="s-completed">configured</b>':'<span class="nf">not set</span>'],["Model",r=>`<input size="22" value="${esc(r.model)}" onchange="setModel('${r.provider}',this.value)">`],["Price $/1M tokens in / out",r=>{const p=(l.prices||{})[r.provider]||{};return `<input size="5" value="${esc(p.in??"")}" placeholder="in" onchange="setPrice('${r.provider}','in',this.value)"> <input size="5" value="${esc(p.out??"")}" placeholder="out" onchange="setPrice('${r.provider}','out',this.value)">`}],["",r=>`<button class="sec" onclick="testP('${r.provider}',this)">Test</button>`]],l.providers)}</div>
  <div class="panel"><div class="row"><label>Primary provider <select onchange="setS({primary_provider:this.value})"><option value="">auto (first configured)</option>${prov.map(p=>`<option ${l.primary===p?"selected":""}>${p}</option>`).join("")}</select></label>
  <label>Fallback order <input size="36" value="${esc((l.fallback_order||[]).join(", "))}" onchange="setS({fallback_order:this.value.split(',').map(x=>x.trim()).filter(Boolean)})"></label>
  <label><input type="checkbox" ${l.cross_verify?"checked":""} onchange="setS({cross_verify:this.checked})"> Cross-model verification of class A (needs 2 providers)</label></div>
  <div class="row"><label>Crawl delay s <input size="3" value="${esc(st.crawl_delay_sec)}" onchange="setS({crawl_delay_sec:+this.value})"></label><label>Max pages/source <input size="3" value="${esc(st.max_pages_per_source)}" onchange="setS({max_pages_per_source:+this.value})"></label><label>Crawl depth <input size="2" value="${esc(st.max_depth)}" onchange="setS({max_depth:+this.value})"></label><label>Periodic recheck every (hours, 0=off) <input size="4" value="${esc(st.recheck_hours)}" onchange="setS({recheck_hours:+this.value})"></label></div>
  <div class="mut">Web search for discovery: ${l.search_configured?"configured":"not configured (set BRAVE_API_KEY or GOOGLE_CSE_KEY+GOOGLE_CSE_CX)"}. Prices are yours to enter; unknown prices are not guessed, so cost shows 0 until set.</div></div>
  <h3>Token &amp; cost tracking</h3><div class="panel">${table([["Provider",r=>esc(r.provider)],["Model",r=>esc(r.model)],["Calls",r=>r.calls],["OK",r=>r.ok_calls],["Tokens in",r=>r.in_tokens],["Tokens out",r=>r.out_tokens],["Cost $",r=>r.cost]],u.totals)}</div>
  <h3>Recent calls / errors</h3><div class="panel">${table([["Time",r=>esc(r.ts)],["Provider",r=>esc(r.provider)],["Purpose",r=>esc(r.purpose)],["OK",r=>r.ok?"yes":"no"],["Error",r=>esc(r.error||"")]],u.recent)}</div>`};
const setS=async b=>{try{await api("settings","POST",b)}catch(e){alert(e.message)}R.ai()};
const setModel=async(p,m)=>{const s=await api("settings");s.models[p]=m;setS({models:s.models})};
const setPrice=async(p,k,v)=>{const s=await api("settings");s.prices[p]=Object.assign(s.prices[p]||{},{[k]:+v||0});setS({prices:s.prices})};
async function testP(p,btn){btn.disabled=true;btn.textContent="…";const r=await api("llm/test","POST",{provider:p});btn.disabled=false;btn.textContent=r.ok?"OK ✓":"Failed";alert(r.ok?`${p}: connection OK (${r.model})`:`${p}: ${r.error}`)}

/* ---------- live refresh ---------- */
async function tick(){if(cur==="dashboard"){const a=document.activeElement;if(!a||a.tagName!=="INPUT")R.dashboard()}else if(cur==="find"){const s=await api("status?since=0");const rb=await runBar();const el=$("#runbar");if(el&&!(document.activeElement&&document.activeElement.tagName==="INPUT"))el.innerHTML=rb.ctrl}}
setInterval(()=>{tick().catch(()=>{})},3000);go("dashboard");
</script></body></html>
